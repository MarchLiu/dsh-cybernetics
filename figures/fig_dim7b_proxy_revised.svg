<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    .t{font-size:18px;font-weight:700;fill:#1f2430}
    .lbl{font-size:13px;fill:#3a4150}
    .num{font-size:13px;font-weight:600;fill:#1f2430}
    .small{font-size:11px;fill:#6b7280}
  </style>
  <text x="30" y="34" class="t">维度⑦ 目标达成率：代理口径 vs 修正口径（失败例外：未响应要求视为失败）</text>
  <text x="30" y="56" class="small">判定基准：board 快照合计 142 个 goal；数据来源 scripts/round3_stats.json（§7.8）与 scripts/round4_stats.json（§7.9）</text>

  <!-- rows: y = 90, 160, 230 ; bar x0=200 max width 480 (100%) -->
  <!-- 严格口径 65/142 = 45.8% -->
  <text x="30" y="105" class="lbl">严格口径（仅 met）</text>
  <rect x="200" y="88" width="219.7" height="30" rx="4" fill="#64748b"/>
  <text x="428" y="108" class="num">65/142 = 45.8%</text>

  <!-- §7.8 代理口径 138/142 = 97.2%: met65 + chain-ach43 + chain-def9 + def21 -->
  <text x="30" y="175" class="lbl">代理口径（§7.8，静默/归档⇒默认接受）</text>
  <rect x="200" y="158" width="219.7" height="30" rx="4" fill="#64748b"/>
  <rect x="419.7" y="158" width="145.4" height="30" fill="#34d399"/>
  <rect x="565.1" y="158" width="30.4" height="30" fill="#fbbf24"/>
  <rect x="595.5" y="158" width="71.8" height="30" rx="4" fill="#fcd34d"/>
  <text x="675" y="178" class="num">138/142 = 97.2%</text>
  <text x="200" y="205" class="small">■ met 65　■ 链末端 met 43　■ 链末端默认接受 9　■ paused 默认接受 21（黄色，§7.9 复核对象）</text>

  <!-- 修正口径 117/142 = 82.4% -->
  <text x="30" y="245" class="lbl">修正口径（§7.9，未响应要求⇒失败）</text>
  <rect x="200" y="228" width="219.7" height="30" rx="4" fill="#64748b"/>
  <rect x="419.7" y="228" width="145.4" height="30" fill="#34d399"/>
  <rect x="565.1" y="228" width="30.4" height="30" fill="#fbbf24"/>
  <rect x="595.5" y="228" width="51.0" height="30" rx="4" fill="#ef4444"/>
  <text x="655" y="248" class="num">117/142 = 82.4%</text>
  <text x="200" y="275" class="small">■ 失败（要求未响应）6：邮件检查×3 + 审批弹窗×2 + native-approval 写入裁定×1（红色）</text>

  <line x1="200" y1="295" x2="680" y2="295" stroke="#e5e7eb"/>
  <text x="30" y="318" class="small">修订链末端达成比例不受影响：52/54 = 96.3%（43 met + 9 默认接受；2 条链末端 running 属进行中会话，未计入分子）</text>
  <text x="30" y="340" class="small">图：figures/fig_dim7b_proxy_revised.svg（round4 生成）；对照图 figures/fig_dim7_proxy.svg（§7.8 原口径，未改动）</text>
</svg>

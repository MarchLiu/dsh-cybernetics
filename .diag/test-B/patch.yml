# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# The DSH Desktop app migrates ~/.dsh/.credentials.yaml to its newer
# versioned format, which this checkout's credentials-local cannot parse;
# point CLI-booted profiles at a separate flat document instead.
- id: credentials
  config:
    path: /Users/mars/.dsh/.credentials-cli.yaml
- id: describe-image
  config:
    baseURL: https://open.bigmodel.cn/api/paas/v4
    model: glm-5v-turbo
    apiKeyEnv: ZHIPU_API_KEY
- id: bloom-theme
  disabled: true
# @linxin666/dsh-client-ui-task-board 0.3.10 requires dsh >= 0.1.2-alpha.1
# (typert session/* Remotes via @deepseek-ai/dsh-api-session-controller); this
# checkout is 0.1.0-rc.8 and exports no `session` Remote, so every poll logged
# `invocation-unavailable: session/list`. Disable until the host is upgraded.
# dsh-web-ui-all aggregates the same task-board package under its own row id;
# disable that copy too, or the poll error survives the standalone disable.
# (In this profile task-board is only mounted through the aggregate, so the
# single web-ui-task-board disable below covers it. Its /api/task-board/events
# SSE also permanently holds one of Chrome's six HTTP/1.1 connections per tab.)
- id: web-ui-task-board
  disabled: true
# The standalone @linxin666/dsh-client-ui-git-graph bundle (row ui-git-graph,
# listed in this profile's bundles) mounts the same package; the aggregate
# copy inside dsh-web-ui-all is a redundant second mount of the git service
# and /git/* routes. Disable it; git status viewing is unaffected.
# dsh-web-ui-all seeds web-ui-ssh with enabled:false; without this override the
# SSH panel's /api/dsh-ssh/* routes are never registered (HTTP 404: invalid
# JSON response).
- id: web-ui-ssh
  config:
    enabled: true

# dsh-at-file 0.6.3 still statically imports `settingsNamespace` from
# @deepseek-ai/dsh-settings, removed in 0.1.2-alpha.2; the import fails boot
# on dsh 0.1.2-rc.1. Re-enable once upstream migrates to the new settings API.
- id: dsh-at-file
  disabled: true
# @mars.liu/dsh-graft 0.2.2 migrated its Node half from the removed `apiProxy`
# seam to ctx.sessionController; re-enabled after verification on dsh 0.1.2-rc.1.
# Correction (0.2.4): dsh 0.1.2-rc.1's turnTail owner passes a TurnLocation
# object (its `.turn` field is the number), never a bare numeric prop, and the
# turnTail CHAIN slot loses the host deliverables badge's registration-order
# election on every file-producing turn — the turn picker now lives in the
# assistant-actions LIST slot instead, where entries coexist by id/order.
# @linxin666/dsh-client-ui-aionui-panel 0.3.6 (latest; mounted by dsh-web-ui-all
# as web-ui-dsh-aionui-panel) requires @deepseek-ai/dsh-client-runtime, a seam
# that does not exist in dsh 0.1.2-rc.1; its client module import fails boot.
# Re-enable once the host is upgraded past 0.1.2 or upstream ships a
# 0.1.2-compatible panel build.
- id: web-ui-dsh-aionui-panel
  disabled: true
# dsh-recover-context 1.0.6 (latest) waits for the service `conversationEvents`,
# which no dsh 0.1.2-rc.1 package provides; the entry stays pending and blocks
# web boot. Re-enable once the host is upgraded or upstream ships a
# 0.1.2-compatible build.
- id: dsh-recover-context
  disabled: true
- id: ui-git-graph
  disabled: false
# dshmarket 1.45.0 的 client 注入 @deepseek-ai/dsh-client-runtime——该 seam 在
# 0.1.2-rc.1 上不完整（同 aionui-panel 前科）；它不崩 boot，但会静默阻断后续
# client 模块加载，dsh-context 的 /context 命令因此注册不上（2026-09-08 经
# canary 隔离环境 6 轮二分定位，issue: dsh-market/dsh-market#554）。
# 插件市场为日常必需，反向取舍：保留 dsh-market，禁用 dsh-context。
- id: dsh-market
  disabled: false

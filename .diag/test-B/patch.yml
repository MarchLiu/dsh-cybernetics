# 修 web_fetch 的 WEB_PROVIDER_AMBIGUOUS（deepseek-fetch-api, http）：
# @240xu/dsh-websearch 的 bundle patch 用 `- id: web` 覆写了同一行，而 patch
# 语义是整块替换 config 而非合并，于是 base 里的 fetchProvider: http 被抹掉；
# fetch 侧同时注册了 http 与 deepseek-fetch-api 两个可用 provider，没指定就抛歧义。
# search 侧不受影响是因为 searchProvider: unified 有值。用户层最后写入，这里两项一起重述。
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: unified
    fetchProvider: http
